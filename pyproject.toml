[project]
name = "julius"
version = "0.6.0"
description = "Agente de otimização AWS executado pelo Devin — MVP 4"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "duckdb>=1.1",
    "sqlglot>=26.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "moto>=5"]

[project.scripts]
julius = "julius.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["julius*"]

[tool.setuptools.package-data]
"julius.report" = ["templates/*.j2", "assets/*.png"]

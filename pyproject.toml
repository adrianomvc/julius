[project]
name = "julius"
version = "0.6.0"
description = "Agente de otimização AWS executado pelo Devin — MVP 4"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "duckdb>=1.1",
    "sqlglot>=26.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "moto>=5", "ruff>=0.16", "mypy>=1.11"]

[project.scripts]
julius = "julius.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["julius*"]

[tool.setuptools.package-data]
# Se este caminho não existir, o pacote instalado sai sem template e o `report`
# quebra só em produção — os testes rodam do repositório e não pegam.
"julius.reporting" = [
    "templates/*.j2",
    # O relatório desenhado. Sem isto o pacote instalado renderiza sem template.
    "templates/design/*.dc.html",
    "assets/*.png",
    # As fontes são opcionais: se não estiverem lá, o desenho usa o `<link>` do
    # Google Fonts que o designer escreveu. Declaradas aqui para que colocá-las
    # na pasta baste — sem mexer no empacotamento depois.
    "assets/fonts/*.woff2",
]
"julius.knowledge.pricing" = ["tables/*.toml", "mapping.toml"]

# A reestruturação move ~14 mil linhas entre pacotes. A suíte pega o que executa;
# lint e tipos pegam o que existe — import morto, assinatura trocada e atributo
# removido em arquivo que nenhum teste toca.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".worktrees", "data", "design"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes: import morto, variável não usada, f-string sem placeholder
    "E9",   # erros de sintaxe e de runtime
    "I",    # ordenação de imports — a fase de movimentação vive disso
    "UP",   # sintaxe moderna coerente com requires-python
    "B",    # bugbear: armadilhas comuns (default mutável, except amplo)
    "TID",  # import relativo fora do padrão do projeto
]
ignore = [
    "B008",   # typer declara opções como default de chamada; é o idioma da lib
    "UP017",  # `datetime.UTC` sobre `timezone.utc`: 51 trocas mecânicas sem
              # ganho, logo antes de mover 14 mil linhas entre pacotes
]

[tool.ruff.lint.per-file-ignores]
# Os testes montam fixtures grandes e importam sob demanda.
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["julius"]

# Modo permissivo por enquanto: o objetivo é pegar assinatura trocada durante a
# movimentação, não converter o projeto a tipagem estrita de uma vez. O rigor
# sobe por módulo, começando por onde os tipos carregam significado.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = "(^|/)(\\.worktrees|data|design)/"

[[tool.mypy.overrides]]
module = [
    "julius.collection.models.*",
    "julius.collection.window",
    "julius.opportunities.base",
]
disallow_untyped_defs = true
check_untyped_defs = true

# Como cada tarifa é identificada na Price List API.
#
# Este arquivo é a parte que ninguém consegue adivinhar com segurança: quais
# atributos de produto identificam "Glue DPU-hora STANDARD". Ele existe para
# que essa escolha seja conferida uma vez, por uma pessoa, olhando o que a API
# realmente devolve — e não fique chutada dentro do código.
#
# Fluxo:
#
#   1. julius pricing inspect --service AWSGlue --region sa-east-1
#      mostra as combinações de atributos e o preço de cada uma.
#   2. ajuste os blocos abaixo para casar com o que apareceu.
#   3. julius pricing refresh --region sa-east-1
#      escreve a tabela. Se qualquer tarifa não casar, nada é escrito.
#
# `match` é uma igualdade exata sobre os atributos do produto. `pick` resolve o
# caso de o produto ter várias dimensões de preço: "min" pega a menor, "max" a
# maior, "only" exige exatamente uma.
#
# `expand = "<atributo>"` rende uma tarifa por valor daquele atributo, em vez de
# um escalar. Existe para tarifa de instância, onde a decisão humana é uma só
# (quais atributos identificam a hora de instância do componente) e a lista de
# valores é longa e muda — mapeá-la à mão seria copiar a mesma decisão dezenas
# de vezes e deixar tipo novo sem tarifa.
#
# ATENÇÃO: os valores abaixo são um ponto de partida plausível, NÃO conferidos
# contra a API. Rodar `inspect` antes do primeiro `refresh` não é opcional.

[glue.dpu_hour]
service = "AWSGlue"
match = { group = "ETL Job run", operation = "jobrun" }
pick = "only"

[glue.flex_dpu_hour]
service = "AWSGlue"
match = { group = "ETL Job run", operation = "jobrunflex" }
pick = "only"

[glue.ray_mdpu_hour]
service = "AWSGlue"
match = { group = "Ray Job run", operation = "jobrun" }
pick = "only"

[glue.databrew_node_hour]
service = "AWSGlue"
match = { group = "DataBrew Job Run" }
pick = "only"

[athena.per_tb]
service = "AmazonAthena"
match = { group = "Athena-Query", operation = "AmazonAthena" }
pick = "only"

[stepfunctions.standard_per_transition]
service = "AWSStepFunctions"
match = { group = "SFN-StateTransitions" }
pick = "min"

[stepfunctions.express_per_request]
service = "AWSStepFunctions"
match = { group = "SFN-ExpressWorkflows-Requests" }
pick = "min"

[stepfunctions.express_per_gb_second]
service = "AWSStepFunctions"
match = { group = "SFN-ExpressWorkflows-Duration" }
pick = "min"

# S3 — a única seção cuja tarifa é usada para COMPARAR duas opções, e não para
# modelar um custo. O rateio do Cost Explorer diz quanto o armazenamento custa
# hoje; ele não diz quanto custaria em Glacier. Recomendar transição de classe
# exige a diferença entre as duas tarifas, e é só para isso que estas entram.
#
# `pick = "min"` no armazenamento porque o S3 cobra em faixas decrescentes por
# volume (primeiros 50 TB, próximos 450 TB, acima de 500 TB). A menor só vale
# para quem passa de 500 TB — e é por isso que ela é a escolha certa: subestima
# o preço do Standard, subestima a diferença entre classes e portanto subestima
# a economia. Errar prometendo menos é o lado seguro de uma recomendação que
# pede para mover petabytes.

[s3.storage_standard]
service = "AmazonS3"
match = { productFamily = "Storage", volumeType = "Standard" }
pick = "min"

[s3.storage_standard_ia]
service = "AmazonS3"
match = { productFamily = "Storage", volumeType = "Standard - Infrequent Access" }
pick = "min"

[s3.storage_onezone_ia]
service = "AmazonS3"
match = { productFamily = "Storage", volumeType = "One Zone - Infrequent Access" }
pick = "min"

[s3.storage_glacier_ir]
service = "AmazonS3"
match = { productFamily = "Storage", volumeType = "Glacier Instant Retrieval" }
pick = "min"

[s3.storage_glacier_flexible]
service = "AmazonS3"
match = { productFamily = "Storage", volumeType = "Amazon Glacier" }
pick = "min"

[s3.storage_deep_archive]
service = "AmazonS3"
match = { productFamily = "Storage", volumeType = "Glacier Deep Archive" }
pick = "min"

# Requests. `list_per_1000` também mede o custo da **própria coleta**: o
# `--s3-full-listing` pagina o data lake inteiro, e o Julius não pode gastar
# dinheiro para descobrir custo sem dizer quanto gastou.
[s3.request_list_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-Tier1" }
pick = "min"

[s3.request_get_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-Tier2" }
pick = "min"

# Mover objeto de classe cobra por request, e é o custo que a recomendação
# precisa descontar da economia — senão promete um número que não acontece.
[s3.request_lifecycle_transition_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-SIA-Tier1" }
pick = "min"

# CopyObject é uma requisição PUT/COPY cobrada conforme a classe de destino.
[s3.request_copy_standard_ia_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-SIA-Tier1" }
pick = "min"

[s3.request_copy_glacier_ir_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-GIR-Tier1" }
pick = "min"

[s3.request_copy_glacier_flexible_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-Glacier-Tier1" }
pick = "min"

# Recuperação: custo por volume e por request. O refresh é atômico; se os
# atributos da Price List mudarem, a seção S3 não é marcada como verificada.
[s3.retrieval_standard_ia_per_gb]
service = "AmazonS3"
match = { group = "S3-API-SIA-DataRetrieval" }
pick = "only"

[s3.retrieval_request_standard_ia_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-SIA-Tier2" }
pick = "min"

[s3.retrieval_glacier_ir_per_gb]
service = "AmazonS3"
match = { group = "S3-API-GIR-DataRetrieval" }
pick = "only"

[s3.retrieval_request_glacier_ir_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-GIR-Tier2" }
pick = "min"

[s3.retrieval_glacier_flexible_per_gb]
service = "AmazonS3"
match = { group = "S3-API-Glacier-DataRetrieval" }
pick = "min"

[s3.retrieval_request_glacier_flexible_per_1000]
service = "AmazonS3"
match = { productFamily = "API Request", group = "S3-API-Glacier-Tier3" }
pick = "min"

# SageMaker — hora de instância por componente. A chave da entrada é o nome do
# componente como as regras o consultam (`pricing.sagemaker_hourly(tipo,
# componente)`); o refresh a escreve em `[sagemaker.components.<componente>]`.
#
# Estas cinco entradas são as que o código realmente consulta: `studio` (app
# ocioso), `notebook`, `training` (warm pool), `processing` e `endpoint`
# (capacidade sem tráfego). Faltando a seção, toda cifra modelada de SageMaker
# fica fora do portfólio — o gate de pricing exige procedência da seção que
# sustenta a fórmula.
#
# `pick = "min"` pelo mesmo motivo do S3: aqui a tarifa mede um custo que a
# recomendação promete eliminar, e a menor subestima a economia. Errar
# prometendo menos é o lado seguro.
#
# ATENÇÃO — o valor de `component` é o palpite menos seguro deste arquivo. A
# Price List do SageMaker já renomeou esses rótulos. Antes do primeiro refresh:
#
#   julius pricing inspect --service AmazonSageMaker --region sa-east-1 \
#       --attributes productFamily,component,instanceName
#
# e ajuste os `match` para o que aparecer. Se não casar, nada é escrito e a
# seção não é marcada como conferida — o erro aparece, não vira tarifa errada.

[sagemaker.studio]
service = "AmazonSageMaker"
match = { productFamily = "ML Instance", component = "Studio Notebook" }
expand = "instanceName"
pick = "min"

[sagemaker.notebook]
service = "AmazonSageMaker"
match = { productFamily = "ML Instance", component = "Notebook" }
expand = "instanceName"
pick = "min"

[sagemaker.training]
service = "AmazonSageMaker"
match = { productFamily = "ML Instance", component = "Training" }
expand = "instanceName"
pick = "min"

[sagemaker.processing]
service = "AmazonSageMaker"
match = { productFamily = "ML Instance", component = "Processing" }
expand = "instanceName"
pick = "min"

[sagemaker.endpoint]
service = "AmazonSageMaker"
match = { productFamily = "ML Instance", component = "Hosting" }
expand = "instanceName"
pick = "min"

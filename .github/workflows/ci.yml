name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q
      - run: python -m ruff check julius tests
      - run: python -m mypy julius
      - name: Pricing verification
        run: julius pricing verify --region sa-east-1 --max-age-days 90
      - name: Read-only AWS allowlist
        run: python scripts/check_read_only_aws.py
